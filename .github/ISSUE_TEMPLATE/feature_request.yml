name: Feature request
description: Suggest an improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Anything you considered instead?
  - type: checkboxes
    id: promises
    attributes:
      label: The project's promises
      description: See CONTRIBUTING.md
      options:
        - label: This keeps everything on the device, needs no new permission, and cannot delete, send or forward mail.
          required: true

name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests and privacy audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - run: sh scripts/build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: mailsort-build
          path: dist/

  browser:
    name: Browser tests (real Chromium, mock inbox)
    runs-on: ubuntu-latest
    continue-on-error: true   # the mock inbox runs in a CI browser; do not block merges on its environment
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright
      - run: playwright install --with-deps chromium
      - run: sudo apt-get install -y xvfb
      - run: xvfb-run -a sh scripts/run-browser-tests.sh

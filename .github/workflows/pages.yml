name: website

# Every push to main rebuilds the zip and republishes the download page. Nobody has to remember to do it.
on:
  push:
    branches: [main]
    paths: ["docs/**", "extension/**", "scripts/build.sh"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: sh scripts/build.sh   # refreshes docs/mailsort.zip so the button always matches the code
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4

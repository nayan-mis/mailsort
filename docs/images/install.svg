<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 300" width="1280" height="300" role="img" aria-label="Install in three steps: download, unzip, load unpacked" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<rect width="1280" height="300" rx="24" fill="#f6f7f9"/>
<rect x="40" y="30" width="360" height="240" rx="20" fill="#fff" stroke="#e3e5e8" stroke-width="2"/><circle cx="86" cy="80" r="22" fill="#111"/><text x="86" y="88" font-size="24" font-weight="800" text-anchor="middle" fill="#fff">1</text><text x="122" y="90" font-size="30" font-weight="800" fill="#111">Download</text><circle cx="220" cy="165" r="46" fill="#dcfce7"/><path d="M220 140 v36 M202 160 l18 18 l18 -18" stroke="#111" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M194 192 h52" stroke="#16a34a" stroke-width="8" stroke-linecap="round"/><text x="220" y="248" font-size="19" text-anchor="middle" fill="#555">One button. It's free.</text>
<rect x="460" y="30" width="360" height="240" rx="20" fill="#fff" stroke="#e3e5e8" stroke-width="2"/><circle cx="506" cy="80" r="22" fill="#111"/><text x="506" y="88" font-size="24" font-weight="800" text-anchor="middle" fill="#fff">2</text><text x="542" y="90" font-size="30" font-weight="800" fill="#111">Unzip</text><rect x="588" y="132" width="104" height="70" rx="12" fill="#16a34a"/><rect x="588" y="122" width="44" height="18" rx="6" fill="#15803d"/><path d="M640 132 v70" stroke="#fff" stroke-width="5" stroke-dasharray="7 6"/><text x="640" y="248" font-size="19" text-anchor="middle" fill="#555">Right-click, Extract.</text>
<rect x="880" y="30" width="360" height="240" rx="20" fill="#fff" stroke="#e3e5e8" stroke-width="2"/><circle cx="926" cy="80" r="22" fill="#111"/><text x="926" y="88" font-size="24" font-weight="800" text-anchor="middle" fill="#fff">3</text><text x="962" y="90" font-size="30" font-weight="800" fill="#111">Load unpacked</text><rect x="1010" y="118" width="100" height="46" rx="23" fill="#16a34a"/><circle cx="1087" cy="141" r="17" fill="#fff"/><rect x="982" y="178" width="156" height="36" rx="18" fill="#111"/><text x="1060" y="202" font-size="17" font-weight="700" text-anchor="middle" fill="#fff">Load unpacked</text><text x="1060" y="248" font-size="19" text-anchor="middle" fill="#555">chrome://extensions, Developer mode</text>
<path d="M408 150 h36 M432 138 l12 12 l-12 12" stroke="#16a34a" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M828 150 h36 M852 138 l12 12 l-12 12" stroke="#16a34a" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
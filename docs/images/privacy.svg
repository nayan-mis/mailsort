<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340" role="img" aria-label="Everything stays in your browser. There is no mailsort server." font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<rect width="1280" height="340" rx="24" fill="#f6f7f9"/>
<rect x="40" y="30" width="700" height="280" rx="24" fill="#ecfdf5" stroke="#16a34a" stroke-width="3"/>
<text x="72" y="72" font-size="20" font-weight="800" letter-spacing="3" fill="#166534">YOUR BROWSER</text>
<rect x="72" y="100" width="190" height="130" rx="16" fill="#fff" stroke="#86efac" stroke-width="2"/><text x="167" y="160" font-size="20" font-weight="700" text-anchor="middle" fill="#111">Gmail / Yahoo</text><text x="167" y="188" font-size="20" font-weight="700" text-anchor="middle" fill="#111">tab</text>
<rect x="292" y="100" width="190" height="130" rx="16" fill="#fff" stroke="#86efac" stroke-width="2"/><text x="387" y="172" font-size="22" font-weight="800" text-anchor="middle" fill="#111">mailsort</text>
<rect x="512" y="100" width="190" height="130" rx="16" fill="#fff" stroke="#86efac" stroke-width="2"/><text x="607" y="160" font-size="20" font-weight="700" text-anchor="middle" fill="#111">Your settings</text><text x="607" y="188" font-size="20" font-weight="700" text-anchor="middle" fill="#111">+ what it learned</text>
<path d="M262 165 h30 M482 165 h30" stroke="#16a34a" stroke-width="4"/>
<path d="M740 170 h120" stroke="#9ca3af" stroke-width="4" stroke-dasharray="10 8"/>
<circle cx="800" cy="170" r="22" fill="#ef4444"/><path d="M790 160 l20 20 M810 160 l-20 20" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
<rect x="860" y="80" width="380" height="180" rx="24" fill="#fff" stroke="#d1d5db" stroke-width="2" stroke-dasharray="10 8"/>
<text x="1050" y="152" font-size="46" font-weight="800" text-anchor="middle" fill="#111">No server.</text>
<text x="1050" y="196" font-size="22" text-anchor="middle" fill="#555">No account. No analytics.</text>
<text x="1050" y="228" font-size="22" text-anchor="middle" fill="#555">No AI service.</text></svg>
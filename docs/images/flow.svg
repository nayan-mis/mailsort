<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 270" width="1280" height="270" role="img" aria-label="What you type goes through a catalog check and a preview before anything happens" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">

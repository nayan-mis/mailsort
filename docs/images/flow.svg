<rect x="54" y="56" width="140" height="66" rx="16" fill="#111" stroke="#111" stroke-width="2"/><text x="124" y="96" font-size="20" font-weight="700" text-anchor="middle" fill="#fff">You type</text>
<path d="M200 89 h14 M208 82 l7 7 l-7 7" stroke="#9ca3af" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

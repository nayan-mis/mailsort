<rect x="54" y="158" width="1172" height="70" rx="16" fill="#fef2f2" stroke="#fecaca" stroke-width="2"/><text x="640" y="200" font-size="22" text-anchor="middle" fill="#991b1b">Delete, forward, send, auto-reply: not in the catalog. Nobody can ask for them. Not you, not a sneaky email.</text></svg>
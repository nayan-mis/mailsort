<path d="M544 89 h14 M552 82 l7 7 l-7 7" stroke="#9ca3af" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="570" y="56" width="140" height="66" rx="16" fill="#16a34a" stroke="#16a34a" stroke-width="2"/><text x="640" y="96" font-size="18" font-weight="700" text-anchor="middle" fill="#fff">Catalog check</text>
